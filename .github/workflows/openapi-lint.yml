name: openapi-lint
# Triggers intentionally disabled for Argus-OSS-Security.
# on:
#   pull_request:
#     paths:
#       - 'docs/static/spec/openapi/logstash-api.yaml'
permissions:
  contents: read
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: elastic/docs-actions/openapi/lint@v1
        with:
          spec-path: docs/static/spec/openapi/logstash-api.yaml
