---
name: github-commands-comment

# Triggers intentionally disabled for Argus-OSS-Security.
# on:
#   pull_request_target:
#     types:
#       - opened
# 
permissions:
  contents: read

jobs:
  comment:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - uses: elastic/oblt-actions/elastic/github-commands@v1
